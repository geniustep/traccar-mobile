name: elmogps
description: "ELMO - Smart Fleet Intelligence Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # HTTP client
  dio: ^5.4.3

  # Secure token storage
  flutter_secure_storage: ^9.0.0

  # Local preferences
  shared_preferences: ^2.2.3

  # Date / number formatting
  intl: ^0.20.2

  # Maps
  google_maps_flutter: ^2.6.1

  # Connectivity
  connectivity_plus: ^5.0.2
  web_socket_channel: ^3.0.3

  # Custom fonts
  google_fonts: ^6.2.1
  uuid: ^4.5.3

  # Charts
  fl_chart: ^0.68.0

  # PDF generation & printing
  pdf: ^3.11.0
  printing: ^5.13.1
  share_plus: ^10.0.0
  path_provider: ^2.1.0
  flutter_svg: ^2.3.0
  firebase_core: ^4.8.0
  firebase_messaging: ^16.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/
    - assets/map/
    - assets/images/
