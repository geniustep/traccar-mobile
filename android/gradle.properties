org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Workaround: Kotlin incremental compile can fail when Pub cache (C:) and project
# (D:) are on different drive roots (share_plus / compileDebugKotlin). Disabling
# incremental avoids corrupt incremental caches during `flutter run` / assembleDebug.
kotlin.incremental=false
